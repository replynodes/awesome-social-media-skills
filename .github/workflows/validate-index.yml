name: Validate skill index

on:
  pull_request:
    paths:
      - "skills/**/*.md"
      - "scripts/generate_index.py"
      - "index.json"
  push:
    branches: [main]
    paths:
      - "skills/**/*.md"
      - "scripts/generate_index.py"
      - "index.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate frontmatter and check index.json is up to date
        run: python3 scripts/generate_index.py --check
